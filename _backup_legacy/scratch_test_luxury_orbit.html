<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      background: #080808;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 440px;
      height: 480px;
      background: #111111;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 32px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .orbit-container {
      position: relative;
      width: 100%;
      height: 280px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .lines-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .center-aura {
      position: absolute;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(2, 132, 199, 0.18) 0%, rgba(2, 6, 23, 0) 70%);
      pointer-events: none;
    }
    .center-node {
      position: absolute;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #38bdf8 0%, #0284c7 40%, #0f172a 100%);
      border: 2px solid #00e5ff;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.8), inset 0 0 8px rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .center-node img {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }
    .satellite {
      position: absolute;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 5;
    }
    .badge {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    /* Satellite positions matching user screenshot */
    /* Top-Left: Brain */
    .pos-tl { top: 15px; left: 65px; }
    /* Top-Right: Bulb */
    .pos-tr { top: 15px; right: 65px; }
    /* Center-Right: OpenAI */
    .pos-cr { top: 108px; right: 28px; }
    /* Bottom-Right: Rocket */
    .pos-br { bottom: 15px; right: 65px; }
    /* Bottom-Left: Shield */
    .pos-bl { bottom: 15px; left: 65px; }

    .badge-brain {
      background: linear-gradient(135deg, #7C3AED 0%, #4C1D95 100%);
      border: 1px solid rgba(196, 181, 253, 0.4);
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }
    .badge-bulb {
      background: linear-gradient(135deg, #D97706 0%, #92400E 100%);
      border: 1px solid rgba(252, 211, 77, 0.4);
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }
    .badge-ai {
      background: linear-gradient(135deg, #10B981 0%, #047857 100%);
      border: 1px solid rgba(110, 231, 183, 0.4);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.85), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }
    .badge-rocket {
      background: linear-gradient(135deg, #059669 0%, #064E3B 100%);
      border: 1px solid rgba(52, 211, 153, 0.4);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }
    .badge-shield {
      background: linear-gradient(135deg, #0891B2 0%, #164E63 100%);
      border: 1px solid rgba(103, 232, 249, 0.4);
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }

    .card-text {
      color: #888888;
      font-size: 15px;
      line-height: 1.5;
      margin: 0;
    }
    .card-text strong {
      color: #FFFFFF;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="orbit-container">
      <div class="center-aura"></div>
      
      <!-- Connection Lines -->
      <svg class="lines-svg" viewBox="0 0 376 280">
        <!-- Center is at (188, 140) -->
        <!-- Top-Left: (97, 47) -->
        <line x1="188" y1="140" x2="97" y2="47" stroke="rgba(255,255,255,0.14)" stroke-width="1.5" />
        <!-- Top-Right: (279, 47) -->
        <line x1="188" y1="140" x2="279" y2="47" stroke="rgba(255,255,255,0.14)" stroke-width="1.5" />
        <!-- Center-Right: (316, 140) -->
        <line x1="188" y1="140" x2="316" y2="140" stroke="rgba(255,255,255,0.14)" stroke-width="1.5" />
        <!-- Bottom-Right: (279, 233) -->
        <line x1="188" y1="140" x2="279" y2="233" stroke="rgba(255,255,255,0.14)" stroke-width="1.5" />
        <!-- Bottom-Left: (97, 233) -->
        <line x1="188" y1="140" x2="97" y2="233" stroke="rgba(255,255,255,0.14)" stroke-width="1.5" />
      </svg>

      <!-- Center UR Badge -->
      <div class="center-node">
        <img src="/payer_clone/framerusercontent.com/images/ur_score_logo.png" alt="UR Score">
      </div>

      <!-- Top-Left: Brain (Deep Cognitive Intelligence) -->
      <div class="satellite pos-tl">
        <div class="badge badge-brain">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>
            <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>
            <path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/>
            <path d="M12 18v3"/>
          </svg>
        </div>
      </div>

      <!-- Top-Right: Lightbulb (Clever Financial Insights) -->
      <div class="satellite pos-tr">
        <div class="badge badge-bulb">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-1 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/>
            <path d="M9 18h6"/>
            <path d="M10 21h4"/>
          </svg>
        </div>
      </div>

      <!-- Center-Right: Authentic OpenAI Swirl (Single AI Icon) -->
      <div class="satellite pos-cr">
        <div class="badge badge-ai">
          <svg width="26" height="26" viewBox="0 0 54 54" fill="none">
            <path d="M38.5 25.4a6.3 6.3 0 0 0-.5-4.4 6.5 6.5 0 0 0-4.6-3.3 6.3 6.3 0 0 0-5.1.7 6.4 6.4 0 0 0-4.2-1.9 6.4 6.4 0 0 0-6.1 4.4 6.4 6.4 0 0 0-3.6 2.6 6.3 6.3 0 0 0-.5 5.1 6.5 6.5 0 0 0 .5 4.4 6.5 6.5 0 0 0 4.6 3.3 6.3 6.3 0 0 0 5.1-.7 6.4 6.4 0 0 0 4.2 1.9 6.4 6.4 0 0 0 6.1-4.4 6.4 6.4 0 0 0 3.6-2.6 6.3 6.3 0 0 0 .5-5.1zm-13.6 9.4a4.4 4.4 0 0 1-2.7-1l3.5-2a.9.9 0 0 0 .5-.8v-4.9l1.5.9v4.2a4.4 4.4 0 0 1-2.8 3.6zm-8.2-4.1a4.3 4.3 0 0 1-.5-2.9l3.5 2a.9.9 0 0 0 .9 0l4.2-2.5v1.7l-3.6 2.1a4.4 4.4 0 0 1-4.5-.4zm-1.1-9.1c.5-.9 1.4-1.5 2.4-1.9v4a.9.9 0 0 0 .4.8l4.2 2.4-1.5.9-3.6-2.1a4.4 4.4 0 0 1-1.9-4.1zm13.7-2.3l-3.5 2a.9.9 0 0 0-.5.8v4.9l-1.5-.9v-4.2a4.4 4.4 0 0 1 5.5-2.6zm3.5 3.1c.9.5 1.6 1.3 2 2.2l-3.5-2a.9.9 0 0 0-.9 0l-4.2 2.5V23l3.6-2.1a4.4 4.4 0 0 1 3 1.5zm.9 8.2a4.4 4.4 0 0 1-2.4 1.9v-4a.9.9 0 0 0-.4-.8l-4.2-2.4 1.5-.9 3.6 2.1a4.4 4.4 0 0 1 1.9 4.1zm-7.6-1.7l-2.2-1.3 2.2-1.3 2.2 1.3-2.2 1.3z" fill="#FFFFFF"/>
          </svg>
        </div>
      </div>

      <!-- Bottom-Right: Rocket / Credit Booster -->
      <div class="satellite pos-br">
        <div class="badge badge-rocket">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
            <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
            <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
            <path d="M12 9v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
          </svg>
        </div>
      </div>

      <!-- Bottom-Left: Shield / Bank Security -->
      <div class="satellite pos-bl">
        <div class="badge badge-shield">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
      </div>

    </div>

    <p class="card-text">
      <strong>Clever AI Insights.</strong> A smart cognitive engine powered by predictive credit simulation, automated financial foresight, and clever real-time tips to elevate your score effortlessly.
    </p>
  </div>

</body>
</html>
