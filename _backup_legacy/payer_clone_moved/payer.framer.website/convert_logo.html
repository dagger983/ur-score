<canvas id="c" width="1024" height="1024"></canvas>
<script>
const img = new Image();
img.onload = () => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  
  // Create rounded squircle path (iOS icon squircle radius is roughly 22.5% of width = 230px on 1024px)
  const r = 230;
  const w = 1024;
  const h = 1024;
  
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(w - r, 0);
  ctx.quadraticCurveTo(w, 0, w, r);
  ctx.lineTo(w, h - r);
  ctx.quadraticCurveTo(w, h, w - r, h);
  ctx.lineTo(r, h);
  ctx.quadraticCurveTo(0, h, 0, h - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.clip();
  
  ctx.drawImage(img, 0, 0, w, h);
  
  const pngData = canvas.toDataURL('image/png');
  window.pngResult = pngData;
  console.log('PNG conversion ready, length:', pngData.length);
};
